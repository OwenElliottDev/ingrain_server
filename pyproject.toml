[project]
name = "ingrain-server"
version = "0.2.1"
description = "Dev tools for Repo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ingrain>=0.2.3",
]

[dependency-groups]
dev = [
    "ftfy>=6.3.1",
    "certifi>=2026.10.19",
    "fastapi==0.156.4",
    "hf-transfer==0.1.9",
    "onnx==1.23.2",
    "onnxconverter-common>=1.16.0",
    "onnxoptimizer>=0.4.2",
    "onnxscript>=0.7.2",
    "open-clip-torch==3.3.0",
    "pillow==13.0.0",
    "pycurl==7.48.0",
    "pydantic==2.14.1",
    "requests>=2.34.2",
    "sentence-transformers==6.1.0",
    "timm==1.0.30",
    "tokenizers==0.23.3",
    "torch==2.14.1+cpu ; platform_machine == 'x86_64'",
    "torch==2.14.1+cpu ; platform_machine == 'aarch64'",
    "torchvision==0.29.1+cpu ; platform_machine == 'x86_64'",
    "torchvision==0.29.1+cpu ; platform_machine == 'aarch64'",
    "transformers==5.20.2",
    "tritonclient[grpc]>=2.73.0",
    "uvicorn==0.54.0",
    "validators==0.36.0",
    "huggingface_hub[hf_xet]>=1.3.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]
torchvision = [
  { index = "pytorch-cpu" },
]
